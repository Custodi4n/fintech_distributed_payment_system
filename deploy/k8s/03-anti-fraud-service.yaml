apiVersion: apps/v1
kind: Deployment
metadata:
  name: anti-fraud-service
  namespace: fintech-platform
  labels:
    app: anti-fraud-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anti-fraud-service
  template:
    metadata:
      labels:
        app: anti-fraud-service
    spec:
      containers:
        - name: anti-fraud-service
          image: fintech/anti-fraud-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://fintech-postgres:5432/antifraud_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fintech-db-secret
                  key: POSTGRES_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fintech-db-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: fintech-common-config
                  key: KAFKA_BOOTSTRAP_SERVERS
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: anti-fraud-service
  namespace: fintech-platform
  labels:
    app: anti-fraud-service
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
      name: http
  selector:
    app: anti-fraud-service